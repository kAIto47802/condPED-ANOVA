[build-system]
requires = ["setuptools >= 61.1.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cond_ped_anova"
description = "Conditional PED-ANOVA: Hyperparameter Importance in Hierarchical & Dynamic Search Spaces"
readme = "README.md"
authors = [
  { name = "Kaito Baba", email = "k.ai.to47802@gmail.com" }
]
classifiers = [
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development",
]
requires-python = ">=3.9"
dependencies = [
  "optuna>=4.7.0",
  "numpy",
]
dynamic = ["version"]

[project.optional-dependencies]
experiments = [
  "optuna_integration", # for ShapleyImportanceEvaluator
  "scikit-learn", # for ShapleyImportanceEvaluator and FanovaImportanceEvaluator
  "shap", # for ShapleyImportanceEvaluator
  "matplotlib", # for plotting results
  "scipy", # for computing metrics such as spearmanr
  "yahpo_gym==1.0.2", # for YAHPO Gym experiments
  "ConfigSpace<1.0.0", # for YAHPO Gym experiments; to be compatible with yahpo_gym
  # uv may incorrectly resolve an old numba (e.g., 0.53.x) via shap's dependencies,
  # that is incompatible with newer Python versions.
  # - https://github.com/astral-sh/uv/issues/8863
  # - https://github.com/astral-sh/uv/issues/6281#issuecomment-2316240724
  "numba>=0.57",
]
check = [
  "mypy",
  "ruff",
]

[tool.setuptools.packages.find]
include = ["cond_ped_anova*"]

[tool.setuptools.dynamic]
version = {attr = "cond_ped_anova.__version__"}

[tool.ruff]
line-length = 99
target-version = "py39"
exclude = [
  ".eggs",
  ".git",
  ".hg",
  ".ruff_cache",
  ".mypy_cache",
  ".venv",
  "venv",
  "_build",
  "buck-out",
  "build",
  "dist",
  "docs",
  ".asv",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
]

[tool.ruff.lint.isort]
lines-after-imports = 2
force-sort-within-sections = true
order-by-type = false

[tool.mypy]
warn_unused_configs = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
strict_equality = true
extra_checks = true
no_implicit_reexport = true

ignore_missing_imports = true
exclude = [".venv", "venv", "^build/"]

