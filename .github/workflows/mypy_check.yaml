name: Type Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install
        run: uv sync --locked --extra check

      - name: Mypy Check
        run: uv run mypy .
